<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're invited · Wanida & Nattakorn</title>
<meta name="description" content="e-card เชิญร่วมงานเลี้ยงฉลองมงคลสมรส วนิดา & ณัฐกร · 16 มกราคม 2570 · บ้านเคียงสะหวัน">
<meta property="og:title" content="Wanida & Nattakorn · 16 · 01 · 2027">
<meta property="og:description" content="We saved a seat for you">
<link rel="icon" href="../assets/img/wn-monogram.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charm:wght@400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500&family=Noto+Serif+Thai:wght@300;400;500&family=Pinyon+Script&display=swap">
<style>
/* e-card: the physical "Reveal" sequence on a phone — seal, flap, liner message, card, flip. Portrait first. */
:root{
  --paper:#F8F6F1;--paper-2:#F3EFE7;--stage:#E5DDD1;--ink:#3D3B38;--muted:#6B665D;--line:rgba(61,59,56,.16);
  --gold:#8A7650;--champagne:#C9AB78;--blush:#EBC3C9;--rose:#C4858F;--sage:#8E9E86;--thyme:#6F7A5F;--liner:#E9DCC4;
  --f-script:'Pinyon Script',cursive;--f-display:'Cormorant Garamond',serif;--f-caps:'Montserrat',sans-serif;--f-th:'Noto Serif Thai',serif;--f-charm:'Charm','Noto Serif Thai',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-th);line-height:1.6;overflow:hidden;background-image:radial-gradient(ellipse at 50% 20%,#EFE8DC 0,var(--stage) 60%)}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.stage{position:relative;height:100%;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);perspective:1400px}
.scene{position:relative;width:min(92vw,400px);aspect-ratio:133/184;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
/* envelope: back view, portrait 133 x 184 */
.env{position:absolute;inset:0;filter:drop-shadow(0 28px 34px rgba(60,40,20,.25)) drop-shadow(0 2px 3px rgba(60,40,20,.12));transition:opacity .8s,transform .8s}
.env .back{position:absolute;inset:0;background:var(--paper);background-image:repeating-linear-gradient(0deg,rgba(120,100,80,.03) 0 1px,transparent 1px 3px)}
.env .liner{position:absolute;inset:0;background:var(--liner);clip-path:polygon(0 0,100% 0,50% 45%)}
.env .liner .msg{position:absolute;left:0;right:0;top:11%;text-align:center;font-family:var(--f-script);font-size:clamp(18px,5.4vw,26px);color:#5E503F;opacity:0;transition:opacity .6s .6s}
.env .pocket{position:absolute;inset:0;background:var(--paper);clip-path:polygon(0 0,50% 44%,100% 0,100% 100%,0 100%);box-shadow:inset 0 0 0 1px rgba(90,70,50,.08)}
.env .pocket::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(90,70,50,.14),transparent 30%);clip-path:polygon(0 0,50% 44%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:46%;background:#F9F5EE;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform 1.2s cubic-bezier(.6,.05,.3,1);z-index:3}
.env .flap::before{content:"";position:absolute;inset:0;background:var(--liner);clip-path:polygon(5% 0,95% 0,50% 90%);opacity:0;transition:opacity .2s .6s}
.env .flap .names{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:var(--f-script);font-size:clamp(20px,6vw,30px);color:var(--ink);transition:opacity .3s}
.env .flap .d{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--f-caps);font-size:10px;letter-spacing:.42em;color:var(--muted);transition:opacity .3s}
.open .env .flap{transform:rotateX(180deg)}
.open .env .flap::before{opacity:1}
.open .env .flap .names,.open .env .flap .d{opacity:0}
.open .env .liner .msg{opacity:1}
.seal{position:absolute;left:50%;top:44.5%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:4;cursor:pointer;border:0;padding:0;
  border-radius:51% 47% 52% 48% / 48% 53% 47% 52%;background:radial-gradient(circle at 34% 30%,#E7D4B0 0%,var(--champagne) 46%,#9A7E4F 100%);
  box-shadow:0 4px 8px rgba(60,40,20,.34),inset -3px -4px 7px rgba(0,0,0,.18),inset 3px 3px 5px rgba(255,255,255,.35);display:grid;place-items:center;transition:transform .6s,opacity .6s}
.seal::before{content:"";position:absolute;inset:12%;border-radius:50%;box-shadow:inset 1.5px 1.5px 2px rgba(0,0,0,.22),inset -1px -1px 1px rgba(255,255,255,.35)}
.seal svg{width:52%;fill:rgba(60,45,20,.45);filter:drop-shadow(0 1px 0 rgba(255,255,255,.35))}
@keyframes pulse{0%,100%{box-shadow:0 4px 8px rgba(60,40,20,.34),0 0 0 0 rgba(201,171,120,.5),inset -3px -4px 7px rgba(0,0,0,.18),inset 3px 3px 5px rgba(255,255,255,.35)}50%{box-shadow:0 4px 8px rgba(60,40,20,.34),0 0 0 14px rgba(201,171,120,0),inset -3px -4px 7px rgba(0,0,0,.18),inset 3px 3px 5px rgba(255,255,255,.35)}}
.scene:not(.open) .seal{animation:pulse 2s ease-out infinite}
.open .seal{transform:translate(-50%,-50%) scale(.5) rotate(-25deg);opacity:0;pointer-events:none}
/* the card inside */
.card{position:absolute;left:7%;right:7%;top:9%;height:88%;z-index:2;transform-style:preserve-3d;transition:transform 1.1s .7s cubic-bezier(.2,.7,.2,1),opacity .5s .9s;cursor:pointer;opacity:0;transform:translateY(6%) scale(.96)}
.open .card{opacity:1}
.open .card{transform:translateY(-60%) scale(1.02)}
.out .card{transform:translateY(0) scale(1.08);z-index:6}
.out .env{opacity:0;transform:translateY(40%) scale(.9);pointer-events:none}
.flipped .card{transform:translateY(0) scale(1.08) rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--paper);background-image:repeating-linear-gradient(0deg,rgba(120,100,80,.03) 0 1px,transparent 1px 3px);box-shadow:0 0 0 1.5px var(--champagne),0 26px 40px -20px rgba(60,40,20,.45),0 2px 5px rgba(60,40,20,.14);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(14px,5%,28px) clamp(14px,6%,26px);gap:6px;overflow:hidden}
.face.back{transform:rotateY(180deg);justify-content:flex-start;gap:6px;overflow-y:auto;padding-top:clamp(12px,4%,20px)}
.front{justify-content:center}
.mono{width:22%;fill:var(--ink);opacity:.85;filter:drop-shadow(-0.7px -0.7px 0 rgba(255,255,255,.95)) drop-shadow(0.9px 1px 0.8px rgba(90,70,50,.35))}
.caps{font-family:var(--f-caps);font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.to{font-family:var(--f-charm);font-size:clamp(17px,4.8vw,22px);color:var(--gold);margin-top:6px}
.front h1{margin:10px 0 0;font-family:var(--f-script);font-weight:400;font-size:clamp(30px,9vw,44px);line-height:1.1;color:var(--ink);text-wrap:balance}
.front h1 .amp{color:var(--rose);font-size:.8em}
.front .th{font-weight:300;letter-spacing:.2em;font-size:clamp(13px,3.6vw,16px)}
.front .date{font-family:var(--f-caps);font-size:clamp(11px,3vw,13px);letter-spacing:.42em;padding-left:.42em;margin-top:10px}
.front .date-th{font-weight:300;font-size:13px;color:var(--muted)}
.front .place{font-family:var(--f-display);font-style:italic;font-size:clamp(17px,4.6vw,21px);color:var(--thyme);margin-top:4px}
.front .emboss{position:absolute;left:0;right:0;bottom:6%;font-family:var(--f-display);font-size:9.5px;letter-spacing:.36em;color:#5F574E}
.flipHint{position:absolute;bottom:3%;left:0;right:0;font-family:var(--f-caps);font-size:9px;letter-spacing:.24em;color:var(--muted);opacity:0;transition:opacity .4s 1.6s}
.out .flipHint{opacity:1}
.back h2{margin:0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(20px,5.6vw,26px)}
.back .sched{width:100%;display:grid;gap:2px;margin-top:2px;text-align:left;font-size:clamp(11.5px,3.2vw,13px)}
.back .sched div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding:3px 0}
.back .sched time{font-family:var(--f-display);font-size:1.2em;font-variant-numeric:tabular-nums}
.back .sched span{font-weight:300}
.pal{display:flex;gap:6px;justify-content:center;margin-top:2px}
.pal i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.back p{margin:0;font-weight:300;font-size:clamp(11px,3.1vw,13px);color:var(--muted);line-height:1.5}
.back .addr{color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;margin-top:auto;padding-top:6px}
.btn{font:500 9.5px/1 var(--f-caps);letter-spacing:.16em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 10px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.gold{border-color:var(--champagne);color:var(--gold)}
.btn:hover{background:var(--gold);border-color:var(--gold);color:var(--paper)}
.tag{font-family:var(--f-caps);font-size:9px;letter-spacing:.3em;color:var(--muted);margin-top:4px}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity .5s 1.4s;pointer-events:none}
.out .bar{opacity:1;pointer-events:auto}
.bar .btn{background:rgba(248,246,241,.9)}
.hint{position:fixed;top:max(14px,env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:var(--f-caps);font-size:10px;letter-spacing:.26em;color:var(--muted);transition:opacity .4s}
.open .hint{opacity:0}
.status{position:fixed;left:0;right:0;bottom:max(70px,calc(env(safe-area-inset-bottom,0px) + 70px));text-align:center;font-size:12px;color:var(--thyme);min-height:1.4em;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
@media (max-height:640px){.scene{width:min(92vw,300px)}}
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="hint" id="hint">แตะที่ครั่งเพื่อเปิดซอง</div>
<div class="stage">
  <div class="scene" id="scene">
    <div class="env" aria-hidden="true">
      <div class="back"></div>
      <div class="liner"><div class="msg">We saved a seat for you</div></div>
      <div class="pocket"></div>
      <div class="flap"><div class="names" id="flapNames">Wanida &amp; Nattakorn</div><div class="d" id="flapDate">16 · 01 · 2027</div></div>
    </div>
    <button class="seal" id="seal" type="button" aria-label="เปิดซอง"><svg data-wn aria-hidden="true"></svg></button>
    <div class="card" id="card" role="button" tabindex="0" aria-label="การ์ดเชิญ แตะเพื่อพลิก">
      <div class="face front">
        <svg class="mono" data-wn aria-hidden="true"></svg>
        <div class="caps">You are invited</div>
        <div class="to" id="to"></div>
        <h1 id="namesEn">Wanida <span class="amp">&amp;</span> Nattakorn</h1>
        <div class="th" id="namesTh">วนิดา · ณัฐกร</div>
        <div class="date" id="dateShort">16 · 01 · 2027</div>
        <div class="date-th" id="dateTh"></div>
        <div class="place" id="venue"></div>
        <div class="emboss">WANIDA &nbsp;·&nbsp; NATTAKORN</div>
        <div class="flipHint">แตะการ์ดเพื่อดูรายละเอียด</div>
      </div>
      <div class="face back">
        <div class="caps">Garden reception</div>
        <h2 id="venue2"></h2>
        <p class="addr" id="address"></p>
        <div class="sched" id="sched"></div>
        <div class="caps" style="margin-top:6px">Dress code · <span id="dressTitle"></span></div>
        <div class="pal" id="pal"></div>
        <p id="dressDesc"></p>
        <div class="acts">
          <a class="btn primary" id="rsvp" href="../#rsvp">RSVP</a>
          <a class="btn" id="map" href="#" target="_blank" rel="noopener">แผนที่</a>
          <a class="btn gold" id="gcal" href="#" target="_blank" rel="noopener">เพิ่มปฏิทิน</a>
          <a class="btn" id="site" href="../">เว็บไซต์งาน</a>
        </div>
        <div class="tag" id="hashtag">#EternallyWN</div>
      </div>
    </div>
  </div>
</div>
<div class="bar" id="bar">
  <a class="btn" id="lineShare" href="#" target="_blank" rel="noopener">แชร์ทาง LINE</a>
  <button class="btn" id="copy" type="button">คัดลอกลิงก์</button>
  <button class="btn" id="replay" type="button">เปิดซองอีกครั้ง</button>
</div>
<p class="status" id="status" role="status" aria-live="polite"></p>

<script src="../assets/js/monogram.js"></script>
<script src="../assets/js/config.js"></script>
<script>
(() => {
  const W = window.WEDDING, C = W.couple, $ = (s) => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.querySelectorAll('svg[data-wn]').forEach((svg) => { svg.setAttribute('viewBox', '0 0 1420 1040'); svg.innerHTML = `<path fill-rule="evenodd" d="${window.WN_PATH}"/>`; });
  // personalise: ?to=ชื่อแขก
  const params = new URLSearchParams(location.search); const to = (params.get('to') || '').trim().slice(0, 60);
  if (to) { $('#to').textContent = 'เรียน ' + to; document.title = `${to} · ${document.title}`; }
  $('#flapNames').innerHTML = `${esc(C.bride.en)} &amp; ${esc(C.groom.en)}`; $('#flapDate').textContent = W.date.short;
  $('#namesEn').innerHTML = `${esc(C.bride.en)} <span class="amp">&amp;</span> ${esc(C.groom.en)}`; $('#namesTh').textContent = `${C.bride.th} · ${C.groom.th}`;
  $('#dateShort').textContent = W.date.short; $('#dateTh').textContent = W.date.th; $('#venue').textContent = W.venue.name; $('#venue2').textContent = W.venue.name;
  $('#address').textContent = W.venue.address; $('#dressTitle').textContent = W.dressCode.title; $('#dressDesc').textContent = W.dressCode.desc; $('#hashtag').textContent = C.hashtag;
  $('#pal').innerHTML = W.dressCode.colors.map((c) => `<i style="background:${c.hex}" title="${esc(c.name)}"></i>`).join('');
  $('#sched').innerHTML = W.schedule.slice(0, 3).map((s) => `<div><time>${esc(s.time)}</time><span>${esc(s.title)}</span></div>`).join('');
  $('#map').href = W.venue.mapUrl; $('#site').href = W.site.url; $('#rsvp').href = W.site.url + '#rsvp';
  const pad = (n) => String(n).padStart(2, '0'); const fmtUtc = (iso) => { const d = new Date(iso); return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`; };
  $('#gcal').href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('งานแต่งงาน ' + C.bride.en + ' & ' + C.groom.en)}&dates=${fmtUtc(W.date.startLocal)}/${fmtUtc(W.date.endLocal)}&details=${encodeURIComponent(W.site.url)}&location=${encodeURIComponent(W.venue.name + ' ' + W.venue.address)}&ctz=Asia/Bangkok`;
  const shareUrl = W.site.ecardUrl + (to ? '?to=' + encodeURIComponent(to) : '');
  $('#lineShare').href = 'https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(shareUrl);
  $('#copy').addEventListener('click', async () => { const st = $('#status'); try { await navigator.clipboard.writeText(shareUrl); st.textContent = 'คัดลอกลิงก์แล้ว'; } catch (e) { st.textContent = shareUrl; } setTimeout(() => (st.textContent = ''), 3500); });
  // sequence
  const scene = $('#scene'); let stage = 0;
  const open = () => { if (stage) return; stage = 1; scene.classList.add('open'); $('#hint').style.opacity = 0; setTimeout(() => { scene.classList.add('out'); stage = 2; }, reduce ? 50 : 2300); };
  $('#seal').addEventListener('click', open);
  const flip = () => { if (stage < 2) return; scene.classList.toggle('flipped'); };
  $('#card').addEventListener('click', flip);
  $('#card').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); stage ? flip() : open(); } });
  $('#replay').addEventListener('click', () => { scene.classList.remove('open', 'out', 'flipped'); stage = 0; $('#hint').style.opacity = 1; });
  if (params.get('auto') === '1') setTimeout(open, 900);
  // petals
  const cv = $('#petals');
  if (!reduce) {
    const ctx = cv.getContext('2d'); const colors = ['#EBD0DF', '#F2C5CE', '#E7B7C8', '#BCDCCB', '#D9C29A']; let w, h, ps = [];
    const mk = (f) => ({ x: Math.random() * w, y: f ? Math.random() * h : -20, r: 5 + Math.random() * 7, a: Math.random() * 6.28, va: (Math.random() - .5) * .03, vy: .2 + Math.random() * .45, sw: Math.random() * 6.28, c: colors[Math.floor(Math.random() * 5)] });
    const rs = () => { w = cv.width = innerWidth; h = cv.height = innerHeight; ps = Array.from({ length: Math.min(28, Math.round(w / 30)) }, () => mk(true)); };
    const dr = () => { ctx.clearRect(0, 0, w, h); for (const p of ps) { p.y += p.vy; p.sw += .012; p.x += Math.sin(p.sw) * .35; p.a += p.va; if (p.y > h + 20) Object.assign(p, mk(false)); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = .7; ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.283); ctx.fill(); ctx.restore(); } requestAnimationFrame(dr); };
    rs(); dr(); addEventListener('resize', rs);
  }
})();
</script>
</body>
</html>
