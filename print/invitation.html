<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>WN · การ์ดเชิญสำหรับพิมพ์ 127×178 มม.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400;500&display=swap">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* การ์ดเชิญ 5×7 นิ้ว (127×178 มม.) + ตัดตก 3 มม. รอบด้าน = หน้ากระดาษ 133×184 มม.
   หน้า-หลังการ์ดดึงมาจากส่วน THE INVITATION ของเว็บ (index.html) ตรง ๆ จึงเหมือนการ์ดจริงเสมอ
   ?plate=1 = แม่พิมพ์ปั๊มนูนชื่อ WANIDA NATTAKORN (สีดำล้วน ตำแหน่งเดียวกับด้านหน้า) สำหรับโรงพิมพ์ */
@page{size:133mm 184mm;margin:0}
:root{--paper:#F7F5F1;--ink:#3F3A36;--muted:#8A817A;--f-th:'Prompt',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#D9D4CA;color:var(--ink);font-family:var(--f-th);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{position:relative;width:133mm;height:184mm;margin:18px auto;background:var(--paper);overflow:hidden;box-shadow:0 10px 30px rgba(60,40,20,.25);break-after:page}
.sheet:last-child{break-after:auto}
.card{position:absolute;left:3mm;top:3mm;width:127mm;height:178mm;container-type:inline-size}
.face{position:absolute;inset:0}
.t{position:absolute;text-align:center;white-space:nowrap;font-family:var(--f-th);margin:0}
.nm{position:absolute;height:auto;overflow:visible;fill:var(--paper);filter:drop-shadow(-0.12mm -0.12mm 0 rgba(255,255,255,.95)) drop-shadow(0.22mm 0.27mm 0.22mm rgba(60,50,40,.36))}
.wn{position:absolute;height:auto;fill:var(--ink)}
.hair{position:absolute;width:.2mm;background:var(--muted);opacity:.7;transform:translateX(-50%)}
.dot{position:absolute;border-radius:50%;display:block}
.qr{position:absolute;display:block} .qr img{display:block;width:100%;height:100%}
.trim{position:absolute;inset:3mm;outline:.2mm dashed rgba(201,171,120,.7);pointer-events:none}
.plate .sheet{background:#fff} .plate .nm{fill:#000;filter:none} .plate .face>:not(.nm){display:none}
@media print{html,body{background:#fff}.sheet{margin:0;box-shadow:none}.trim{display:none}}
</style>
</head>
<body>
<section class="sheet" data-side="front"><div class="card"></div><div class="trim"></div></section>
<section class="sheet" data-side="back"><div class="card"></div><div class="trim"></div></section>

<script src="assets/js/monogram.js"></script>
<script src="assets/js/names.js"></script>
<script>
(async () => {
  const plate = new URLSearchParams(location.search).has('plate');
  if (plate) { document.documentElement.classList.add('plate'); document.querySelector('[data-side="back"]').remove(); document.title = 'WN · แม่พิมพ์ปั๊มนูนชื่อ (ด้านหน้า)'; }
  const doc = new DOMParser().parseFromString(await (await fetch('index.html', { cache: 'no-store' })).text(), 'text/html');
  const faces = { front: doc.querySelector('#invitation .pcard.front .face'), back: doc.querySelector('#invitation .pcard.back .face') };
  document.querySelectorAll('.sheet').forEach((sh) => { const f = faces[sh.dataset.side]; if (f) sh.querySelector('.card').appendChild(document.importNode(f, true)); });
  document.querySelectorAll('svg[data-wn]').forEach((svg) => { svg.setAttribute('viewBox', '0 0 1420 1040'); svg.innerHTML = `<path fill-rule="evenodd" d="${window.WN_PATH}"/>`; });
  const n = window.NAMES_EMBOSS;
  document.querySelectorAll('svg[data-names]').forEach((s) => { s.setAttribute('viewBox', `${n.box[0]} ${n.box[1]} ${n.w} ${n.h}`); s.innerHTML = `<path d="${n.d}" fill-rule="evenodd"/>`; });
  document.querySelectorAll('.qr').forEach((a) => a.removeAttribute('href'));
  await document.fonts.ready; await Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r))));
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
